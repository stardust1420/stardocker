# Builds release binaries when a v* tag is pushed (see .github/workflows/release.yml).
# Try it locally with: goreleaser release --snapshot --clean
version: 2

project_name: stardocker

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^Merge pull request"

# Homebrew: create a public repo named homebrew-tap, add a fine-grained token
# with write access to it as the HOMEBREW_TAP_TOKEN secret, then uncomment.
